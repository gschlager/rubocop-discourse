inherit_gem:
  rubocop-discourse-base:
    - stree-compat.yml

plugins:
  - rubocop-discourse

inherit_from:
  - ./rubocop-capybara.yml
  - ./rubocop-factory_bot.yml
  - ./rubocop-rspec.yml
  - ./rubocop-rails.yml

AllCops:
  Exclude:
    - "db/schema.rb"
    - "bundle/**/*"
    - "vendor/**/*"
    - "**/node_modules/**/*"
    - "public/**/*"
    - "plugins/**/gems/**/*"
    - "plugins/**/vendor/**/*"

Discourse:
  Enabled: true

Discourse/FabricatorShorthand:
  Enabled: true
  Include:
    - "**/spec/**/*"
